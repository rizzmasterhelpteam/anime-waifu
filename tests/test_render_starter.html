<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #222; overflow: hidden; }
    canvas { width: 800px; height: 800px; display: block; }
  </style>
</head>
<body>
  <canvas id="c" width="800" height="800"></canvas>
  <script src="vendor/vrm-bundle.js"></script>
  <script>
    (async () => {
      try {
        const canvas = document.getElementById("c");
        const { THREE, GLTFLoader } = WAIFU_VRM_VENDOR;

        const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
        renderer.setSize(800, 800);
        renderer.setPixelRatio(1);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x334455);
        const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);

        const hemi = new THREE.HemisphereLight(0xfff8ff, 0x867ea6, 1.62);
        scene.add(hemi);
        const key = new THREE.DirectionalLight(0xfffaf6, 1.45);
        key.position.set(0.8, 1.8, 2.0);
        scene.add(key);

        const resp = await fetch("assets/models/seraphina_starter.glb");
        const buffer = await resp.arrayBuffer();
        const loader = new GLTFLoader();
        const gltf = await loader.parseAsync(buffer, "");

        scene.add(gltf.scene);

        const box = new THREE.Box3().setFromObject(gltf.scene);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        camera.position.set(center.x, center.y + 0.1, center.z + size.y * 1.2);
        camera.lookAt(center.x, center.y + 0.1, center.z);

        renderer.render(scene, camera);
      } catch (e) {
        console.error(e);
      }
    })();
  </script>
</body>
</html>
