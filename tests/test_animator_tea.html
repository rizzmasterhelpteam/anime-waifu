<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #111; overflow: hidden; }
    canvas { width: 460px; height: 600px; display: block; }
    #err { color: red; font-size: 16px; position: absolute; }
  </style>
</head>
<body>
  <div id="err"></div>
  <canvas id="c" width="460" height="600"></canvas>
  <script src="vendor/vrm-bundle.js"></script>
  <script src="content/vrm-animator.js"></script>
  <script>
    (async () => {
      try {
        const canvas = document.getElementById("c");
        // Mock fetchModelBuffer in animator
        const origFetch = WaifuVrmAnimator.prototype.fetchModelBuffer;
        WaifuVrmAnimator.prototype.fetchModelBuffer = async function() {
          const res = await fetch("assets/models/seraphina.vrm");
          return {
            source: "bundled_vrm",
            name: "seraphina.vrm",
            buffer: await res.arrayBuffer()
          };
        };

        const anim = new WaifuVrmAnimator(canvas, { height: 600 });
        await anim.preloadAll();
        anim.setPose("tea", false);

        // Advance 2 seconds into tea animation
        for (let i = 0; i < 120; i++) {
          anim.renderFrame(1000 + i * 16.6);
        }

        document.title = "TEA_ANIM_DONE";
      } catch (e) {
        document.getElementById("err").innerText = e.stack || e.message;
      }
    })();
  </script>
</body>
</html>
