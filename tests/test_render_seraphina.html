<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #222; overflow: hidden; }
    canvas { width: 800px; height: 800px; display: block; }
    #err { color: red; font-size: 20px; position: absolute; top: 10px; left: 10px; z-index: 999; }
  </style>
</head>
<body>
  <div id="err"></div>
  <canvas id="c" width="800" height="800"></canvas>
  <script src="vendor/vrm-bundle.js"></script>
  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById("err").innerText = msg + " at " + line;
    };
    (async () => {
      try {
        const canvas = document.getElementById("c");
        const { THREE, createVrmGltfLoader } = WAIFU_VRM_VENDOR;

        const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
        renderer.setSize(800, 800);
        renderer.setPixelRatio(1);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x334455);
        const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);

        const hemi = new THREE.HemisphereLight(0xfff8ff, 0x867ea6, 1.62);
        scene.add(hemi);

        const key = new THREE.DirectionalLight(0xfffaf6, 1.45);
        key.position.set(0.8, 1.8, 2.0);
        scene.add(key);

        const frontFill = new THREE.DirectionalLight(0xfff4f8, 0.55);
        frontFill.position.set(-0.6, 0.4, 2.2);
        scene.add(frontFill);

        const resp = await fetch("assets/models/seraphina.vrm");
        if (!resp.ok) throw new Error("fetch failed: " + resp.status);
        const buffer = await resp.arrayBuffer();
        const loader = createVrmGltfLoader();
        const gltf = await loader.parseAsync(buffer, "");

        const vrm = gltf.userData.vrm;
        const model = vrm ? vrm.scene : gltf.scene;
        scene.add(model);

        // Center on whole model
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        console.log("Box:", box, "Center:", center, "Size:", size);

        camera.position.set(center.x, center.y + 0.1, center.z + size.y * 1.2);
        camera.lookAt(center.x, center.y + 0.1, center.z);

        // Render loop
        function animate() {
          if (vrm) vrm.update(0.016);
          renderer.render(scene, camera);
          requestAnimationFrame(animate);
        }
        animate();
        document.title = "SUCCESS_LOADED";
      } catch (e) {
        document.getElementById("err").innerText = e.stack || e.message;
      }
    })();
  </script>
</body>
</html>
