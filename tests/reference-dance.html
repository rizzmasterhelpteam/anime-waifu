<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Source dance comparison</title>
<style>
body{margin:0;background:#262733;color:#eee;font:15px system-ui}header{padding:12px 20px}h1{font-size:20px;margin:0 0 8px}button,a{display:inline-block;margin:3px;padding:7px 12px;background:#eee;color:#222;border:0;border-radius:4px;text-decoration:none}input{width:280px;vertical-align:middle}main{display:flex;justify-content:center;gap:16px}section{text-align:center}h2{font-size:16px;margin:5px}canvas{display:block;background:#30313d;border:1px solid #555;border-radius:8px}#status{margin-left:10px}
</style>
<header><h1>Stabilized 3D dance comparison</h1>
<a href="?model=seraphina">Seraphina</a><a href="?model=gothic_red">Crimson</a>
<button id="play">Play</button><button id="export">Save comparison</button><input id="seek" aria-label="Dance timestamp" type="range" min="0" max="9.95" value="3.5" step="0.05"><span id="status">Loading…</span>
<div id="poses"></div></header>
<main><section><h2>Actual 2D source</h2><canvas id="source" width="368" height="480"></canvas></section><section><h2>Retargeted 3D rig</h2><canvas id="rig"></canvas></section></main>
<script>
const model=new URLSearchParams(location.search).get('model')||'seraphina';
window.chrome={runtime:{getURL:p=>'/'+p+'?reference=8'}};
</script>
<script src="/vendor/vrm-bundle.js"></script><script src="/shared/dance-player.js?reference=8"></script><script src="/content/secondary-motion.js"></script><script src="/content/vrm-animator.js?reference=8"></script>
<script>
const status=document.querySelector('#status'),seek=document.querySelector('#seek'),play=document.querySelector('#play');
const sprite=new WAIFU_DANCE.SpriteDance(),ctx=document.querySelector('#source').getContext('2d');
const animator=new WaifuVrmAnimator(document.querySelector('#rig'),{modelKey:model,height:480,depth25D:false});
animator.fetchModelBuffer=async()=>({buffer:await(await fetch('/assets/models/'+(model==='gothic_red'?'companion_alt':'seraphina')+'.vrm')).arrayBuffer(),name:model+'.vrm',source:'bundled'});
let running=false,clock=0,seconds=3.5,ready=false,drawSequence=0;
async function show(t){
 const sequence=++drawSequence;seconds=t;await sprite.page(Math.floor(t));await sprite.page(Math.floor(t)+1);
 if(sequence!==drawSequence)return;
 const now=10000+t*1000;ctx.clearRect(0,0,368,480);sprite.draw(ctx,{start:10000},now,0,0,368,480);
 animator.behavior={id:'dance',start:10000,until:20000};animator.renderFrame(now);
 status.textContent=model+' • '+t.toFixed(2)+' s';seek.value=t;
}
async function frame(now){if(!running)return;const t=(now-clock)/1000;if(t>=10){running=false;play.textContent='Play';await show(9.999);return;}await show(t);if(running)requestAnimationFrame(frame);}
play.onclick=()=>{if(!ready)return;running=!running;play.textContent=running?'Pause':'Play';if(running){if(seconds>=9.95)seconds=0;clock=performance.now()-seconds*1000;requestAnimationFrame(frame);}};
document.querySelector('#export').onclick=async()=>{
 if(!ready)return;running=false;play.textContent='Play';await show(seconds);
 const output=document.createElement('canvas');output.width=800;output.height=550;const painter=output.getContext('2d');
 painter.fillStyle='#30313d';painter.fillRect(0,0,800,550);painter.fillStyle='#eee';painter.font='18px system-ui';
 painter.fillText(model+' — '+seconds.toFixed(2)+' s',20,26);painter.font='15px system-ui';painter.fillText('Actual 2D source',20,51);painter.fillText('Retargeted 3D rig',420,51);
 painter.drawImage(document.querySelector('#source'),16,62,368,480);painter.drawImage(document.querySelector('#rig'),416,62,368,480);
 const link=document.createElement('a');link.href=output.toDataURL('image/jpeg',.94);link.download=model+'-dance-comparison.jpg';link.textContent='Download comparison image';link.id='comparison-download';document.querySelector('#comparison-download')?.remove();document.body.append(link);const preview=document.querySelector('#comparison-image')||document.createElement('img');preview.id='comparison-image';preview.alt='Saved source and 3D dance comparison';preview.src=link.href;preview.style.cssText='display:block;max-width:800px;margin:16px auto';document.body.append(preview);
};
seek.oninput=()=>{running=false;play.textContent='Play';show(Number(seek.value));};
for(const time of [.5,1.5,2.5,3.5,4.5,5.5,6,6.8,7.2,8,8.8,9.5]){const button=document.createElement('button');button.textContent=time+' s';button.onclick=()=>{running=false;play.textContent='Play';show(time);};document.querySelector('#poses').append(button);}
(async()=>{await animator.preloadAll();animator.stopLoop();await Promise.all([sprite.prepare(model),animator.prepareDance()]);ready=true;await show(seconds);})().catch(e=>status.textContent='ERROR: '+e.message);
</script></html>
